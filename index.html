<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project</title>

<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body{
            background-color: rgb(47, 71, 148);
            text-align: center;
            color:rgb(99, 108, 82);
            font-family: Sans-serif;
        }

        .box{
            background-color:antiquewhite;
            border-radius: 10px;
            padding: 20px;
            width: 25%;
            margin-left: auto;
            margin-right: auto;
            border: 4px solid rgb(99, 108, 82);

        }

    </style>

</head>
<body>

<!--insert navbar-->
<!---------------------------------------------------------------------------------------------------->
<!---------------------------------------------------------------------------------------------------->
<!---------------------------------------------------------------------------------------------------->

<div class="box">
    <h1 style="font-weight: bold">TV Tea! - 📺</h1>
    <h4>📄 SKU Generator </h4>

    <form>

    <!--Category Select-->
            <label for="options">🫙 Category: </label>
            <select name="category "id="category" required>
                <option> Kitchen Tools</option>
                <option> Instruments</option>
                <option> Games</option>
            </select>
            <br><br>

    <!--Product Name-->
            <label for="product">📛 Product Name: </label>
            <input type="text" id="name" name="name" placeholder="(example: Guitar)" required>
            <br><br>

    <!--Stock Quantity-->
            <label for="stock">📦 Stock Quantity: </label>
            <input type="number" id="stock" name="stock" placeholder="(example: 20)" required>
            <br><br>

<!---------------------------------------------------------------------------------------------------->

    <!--Generate-->
            <button type="button" py-click="generation" id="btn">Generate</button>
            <br>

    <!--Generation Output-->
        <h4> ____Your SKU will appear here____</h4>

            <div id="sku_output">
                <script type="py" src="main.py"></script>
            </div>

    </form>

</div>

<!---------------------------------------------------------------------------------------------------->
<!---------------------------------------------------------------------------------------------------->
<!---------------------------------------------------------------------------------------------------->
<!--insert footer-->


    <script type="py" src="main.py"></script>
    
</body>
</html>
